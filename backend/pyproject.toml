[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-mi-backend"
version = "0.1.0"
description = "Backend foundation for the BCI motor imagery project"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "httpx2>=2,<3", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bci_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
