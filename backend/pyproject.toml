[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-mi-backend"
version = "0.1.0"
description = "FastAPI service serving the BCI motor imagery classifier"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "scikit-learn==1.4.0",
  "joblib>=1.3,<2",
  "pandas>=2.0,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bci_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", ".."]
