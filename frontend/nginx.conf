server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trial uploads are ~150 KB; keep in line with the backend's BCI_MAX_REQUEST_BYTES.
    client_max_body_size 3m;

    # Resolve the backend through Docker's embedded DNS at request time (not only at
    # startup), so nginx starts even if the backend is down and follows it across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access: the browser talks only to this server, nginx forwards
    # to the backend service on the internal Docker network.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }
}
